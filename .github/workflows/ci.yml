name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cheminsetfontaines_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://cf:cf@localhost:5432/cheminsetfontaines_test?schema=public"
      NOTIFY_EMAIL: "contact@cheminsetfontaines.fr"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:logic 2>&1 | tee step-check.log
      - run: npx prisma db push 2>&1 | tee step-db.log
      - run: npm run db:seed 2>&1 | tee step-seed.log
      - run: npm run typecheck 2>&1 | tee step-typecheck.log
      - run: npm run build 2>&1 | tee step-build.log
      # En cas d'échec, publier la fin des logs dans une issue du repo
      # pour diagnostiquer sans accès authentifié aux logs Actions.
      - name: Journal d'echec vers issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in step-*.log; do echo "--- $f (fin) ---" >> tutti.log; tail -n 80 "$f" >> tutti.log; done
          gh issue create -R olivierpellegrin-ops/cheminsetfontaines \
            -t "CI : journal d'echec (${GITHUB_SHA::7})" \
            -F tutti.log || true
      - name: Fermer l'issue si succes
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list -R olivierpellegrin-ops/cheminsetfontaines --state open --limit 5 \
            --json number,title --jq '.[] | select(.title | startswith("CI : journal")) | .number' \
            | while read n; do gh issue close "$n" -R olivierpellegrin-ops/cheminsetfontaines || true; done