name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cheminsetfontaines_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://cf:cf@localhost:5432/cheminsetfontaines_test?schema=public"
      NOTIFY_EMAIL: "contact@cheminsetfontaines.fr"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build
