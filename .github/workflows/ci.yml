name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cheminsetfontaines_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://cf:cf@localhost:5432/cheminsetfontaines_test?schema=public"
      NOTIFY_EMAIL: "contact@cheminsetfontaines.fr"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # NOTE : tant que package-lock.json n'est pas committé, on utilise
      # `npm install` (le lock sera généré au premier `npm install` local
      # puis committé ; on repassera alors à `cache: npm` + `npm ci`).
      - run: npm install --no-audit --no-fund
      - run: npm run check:logic
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build