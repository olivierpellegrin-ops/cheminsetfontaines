[{"type":"text","text":"successfully downloaded text file (SHA: ca9d9a5f452c6329678b389ebd44abc99158c5c8)"},{"type":"resource","resource":{"uri":"repo://olivierpellegrin-ops/cheminsetfontaines/sha/1df36536264f9280b7ce82f02488c1593e8251ed/contents/.github/workflows/production.yml","mimeType":"text/plain; charset=utf-8","text":"name: Production (base Neon)\n\n# Rappel : le DEPLOIEMENT DU SITE lui-meme est assure par Vercel\n# (import du repo -> build + deploy automatique a chaque push sur main,\n# previews automatiques sur chaque PR). Ce workflow n'accepte que la BASE :\n# - push sur main qui touche prisma/schema.prisma -> prisma db push sur Neon\n# - declenchement manuel, avec ou sans seed initial (derniere etape du runbook,\n#   voir docs/DEPLOIEMENT.md)\n\non:\n  push:\n    branches: [main]\n    paths: [\"prisma/**\"]\n  workflow_dispatch:\n    inputs:\n      seed:\n        description: \"Seed initial de la base de production (cases cocher uniquement pour la mise en prod)\"\n        type: boolean\n        required: true\n        default: false\n\nconcurrency:\n  group: prod-db\n  cancel-in-progress: false\n\npermissions:\n  issues: write\n\njobs:\n  db-push:\n    name: prisma db push (Neon)\n    runs-on: ubuntu-latest\n    env:\n      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-node@v5\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci --no-audit --no-fund\n      - run: npx prisma db push  2>&1 | tee step-db.log\n      # Meme garde-fou que la CI : publier la fin des logs dans une issue\n      # pour diagnostiquer sans acces authentifie aux logs Actions.\n      - name: Journal d'echec vers issue\n        if: failure()\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          for f in step-*.log; do echo \"--- $f (fin) ---\" >> tutti.log; tail -n 80 \"$f\" >> tutti.log; done\n          gh issue create -R olivierpellegrin-ops/cheminsetfontaines \\\n            -t \"Prod DB : journal d'echec (${GITHUB_SHA::7})\" \\\n            -F tutti.log || true\n      - name: Fermer les issuesProd si succes\n        if: success()\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          gh issue list -R olivierpellegrin-ops/cheminsetfontaines --state open --limit 5 \\\n            --json number,title --jq '.[] | select(.title | startswith(\"Prod DB : journal\")) | .number' \\\n            | while read n; do gh issue close \"$n\" -R olivierpellegrin-ops/cheminsetfontaines || true; done\n\n  db-seed:\n    name: seed initial (optionnel)\n    needs: db-push\n    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed == true }}\n    runs-on: ubuntu-latest\n    env:\n      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}\n      ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}\n      ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}\n      ADMIN_NAME: ${{ secrets.PROD_ADMIN_NAME }}\n      NOTIFY_EMAIL: contact@cheminsetfontaines.fr\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-node@v5\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci --no-audit --no-fund\n      - run: npm run db:seed 2>&1 | tee step-seed.log\n      - name: Journal d'echec vers issue\n        if: failure()\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          for f in step-*.log; do echo \"--- $f (fin) ---\" >> tutti.log; tail -n 80 \"$f\" >> tutti.log; done\n          gh issue create -R olivierpellegrin-ops/cheminsetfontaines \\\n            -t \"Prod SEED : journal d'echec (${GITHUB_SHA::7})\" \\\n            -F tutti.log || true\n"}}]